services:
  app:
    build: .
    env_file: .env
    environment: { HOST: 0.0.0.0, DATA_DIR: /data/db, UPLOAD_DIR: /data/uploads }
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["ps-data:/data"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
volumes: { ps-data: {} }
