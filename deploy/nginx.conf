# /etc/nginx/sites-available/physiostudio   (TLS via: certbot --nginx -d physiostudio.com.np -d www.physiostudio.com.np)
limit_req_zone $binary_remote_addr zone=ps_auth:10m rate=10r/m;
server {
  listen 80; server_name physiostudio.com.np www.physiostudio.com.np;
  return 301 https://physiostudio.com.np$request_uri;
}
server {
  listen 443 ssl http2; server_name physiostudio.com.np;
  # ssl_certificate / ssl_certificate_key managed by certbot
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 6m;
  server_tokens off;
  location ~ ^/(login|staff/login|login/2fa|forgot|register) { limit_req zone=ps_auth burst=5 nodelay; proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
  location /static/ { alias /opt/physiostudio/public/; expires 7d; }
  location / { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
}
